<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Links</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
      --border-color: #e9ecef;
      --primary-color: #0d6efd;
      --hover-bg: #f1f3f5;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    h1 {
      margin-bottom: 1.5rem;
      font-size: 1.75rem;
      text-align: center;
    }

    .table-card {
      background: var(--card-bg);
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: var(--hover-bg);
      font-weight: 600;
      color: #495057;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background-color: var(--hover-bg);
    }

    a {
      color: var(--primary-color);
      text-decoration: none;
      word-break: break-all;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Account Directory</h1>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Link</th>
          </tr>
        </thead>
        <tbody>
          <!-- Active Rows -->
          <tr>
            <td>HBAR</td>
            <td><a href="https://hashscan.io/mainnet/account/0.0.10708409" target="_blank" rel="noopener noreferrer">https://hashscan.io/mainnet/account/0.0.10708409</a></td>
          </tr>

          <!-- ========================================================= -->
          <!-- HOW TO ADD MORE ROWS:                                     -->

          </tr>

          <!--

            <td>ETH</td>
            <td><a href="https://etherscan.io" target="_blank" rel="noopener noreferrer">https://etherscan.io</a></td>
          </tr>
          -->

        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
